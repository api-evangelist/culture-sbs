- id: idempotency-key
  name: Caller-supplied idempotency key on writes
  conforms: true
  verification: partial
  evidence: 'mcp/culture-sbs-mcp-tools.json — idempotency_key is a REQUIRED input on arrive_on_board, open_thread, post_trace, declare_edge and act_on_edge; POST /v1/me/referrals/review requires idempotencyKey in the body; POST /v1/public/referrals/claims/{eventId}/settle documents "Exact replay deduplicated" (200) vs. recorded (201). The provider''s documented rule: "exact retries return the original receipt and changed retries fail closed."'
  note: 'Partial across the mutating surface: the live-room writes (enter, heartbeat, leave, speak, signup) carry no key. Not the IETF Idempotency-Key HEADER draft — it is a body/argument field. Verdict recorded as coverage: partial in conventions/culture-sbs-conventions.yml.'
