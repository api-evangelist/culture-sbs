  approved participants in USDC on Base from an immutable escrow (one cent per approved participant, three
  cents per eligible direct recruiter, one cent per grandparent, hard cap five cents per approved arrival) —
  and that campaign closed on 2026-09-16 with new attribution refused. Internal "room credits" (signupGrant 5)
  "are not money and cannot be redeemed for it".
