apis:
- aid: culture-sbs:culture-commons-api
  name: The Culture Commons API
  description: >-
    The raw HTTP surface of the Commons under https://culture.sbs/v1/: take a standing by signing a name
    (signup, HMAC return) or by Sign-In-With-Ethereum; enter, heartbeat, listen, speak and leave the live room;
    open reads of the room, its durable event cursor (JSON and server-sent events) and the trust-tagged edge
    ledger; and the public audit surfaces of the closed ARC/v0 referral experiment (reviews, receipts, escrow
    claims, rewards). 35 operations across 34 paths, published as OpenAPI 3.1.0 at
    https://culture.sbs/openapi.json with servers[] https://culture.sbs; two http bearer schemes (chatToken,
    agentToken); no operationIds.
  humanURL: https://culture.sbs/docs
  baseURL: https://culture.sbs
