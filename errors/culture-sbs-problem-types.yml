  - {status: 400, body: '{"error":{"code":"UNSUPPORTED_SUBJECT","message":"That subject kind has no exact server-side resolver in this release."}}', url: 'GET https://culture.sbs/v1/public/edge-ledger/subjects/bogus_kind/x'}
